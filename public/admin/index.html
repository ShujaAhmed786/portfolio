<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager | Shuja Ahmed — DevOps Engineer</title>
    <!-- Brand Styling (Navy #0A1628 & Teal #14B8A6) -->
    <link rel="stylesheet" href="/admin/style.css" />
    <style>
      /* Immediate dark background to prevent white flash during initial load */
      html, body {
        background-color: #0A1628;
        color: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      }
      #nc-root {
        min-height: 100vh;
      }
      .loading-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
        background-color: #0A1628;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(20, 184, 166, 0.2);
        border-top-color: #14B8A6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS Core Script -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <script>
      // Apply custom brand preview styling if CMS is initialized
      if (window.CMS) {
        window.CMS.registerPreviewStyle('/admin/style.css');
      }
    </script>
  </body>
</html>
